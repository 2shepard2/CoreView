# CoreView Studio. Settings come from .env next to this file (copy
# .env.example); secrets are files in ./secrets (see README "Quick start").
# Put a reverse proxy with HTTPS in front of both ports, or set
# COOKIE_SECURE=0 for a plain-HTTP test on your LAN.
name: ${COMPOSE_PROJECT_NAME:-coreview-studio}

services:
  studio:
    container_name: ${CONTAINER_NAME:-coreview-studio}
    build: .
    init: true
    environment:
      TZ: ${TZ:-UTC}
      DISPLAY_PORT: "3216"
      ADMIN_PORT: "3217"
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Integrations: leave a URL blank to switch that feature off.
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_KEY_FILE: /run/secrets/immich_api_key
      HA_URL: ${HA_URL:-}
      HA_TOKEN_FILE: /run/secrets/ha_token
      FRIGATE_URL: ${FRIGATE_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      LAB_STORAGE_METRIC: ${LAB_STORAGE_METRIC:-}
      LAB_HOST_PATTERN: ${LAB_HOST_PATTERN:-}
      # Jellyfin for the "Now showing" widget (API key in secrets/jellyfin_api_key).
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_KEY_FILE: /run/secrets/jellyfin_api_key
      # The LED Matrix (CoreView Beacon) over an MQTT broker, e.g. HA's Mosquitto.
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-coreview-studio}
      MQTT_TOPIC_ROOT: ${MQTT_TOPIC_ROOT:-home/signage}
      SETTINGS_LOCK: ${SETTINGS_LOCK:-0}
      AGENT_TOKEN_FILE: /run/secrets/agent_token
      SETUP_CODE_FILE: /run/secrets/setup_code
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DISPLAY_PORT:-3216}:3216"
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-3217}:3217"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3217/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
