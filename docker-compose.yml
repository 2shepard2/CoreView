name: coreview

services:
  coreview:
    container_name: coreview
    init: true
    build:
      context: ./server
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      SENDSPIN_ADAPTER_URL: http://sendspin-adapter:8929
    ports:
      - "${HOST_PORT:-3210}:3210"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3210/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  sendspin-adapter:
    container_name: coreview-sendspin-adapter
    init: true
    build:
      context: ./sendspin-adapter
    environment:
      SENDSPIN_CLIENT_PORT: 8928
      SENDSPIN_STATUS_PORT: 8929
    ports:
      - "${SENDSPIN_CLIENT_PORT:-8928}:8928"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/sendspin:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8929/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
