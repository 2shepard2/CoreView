# Beacon 2.0: CoreView Matrix MQTT client (V1 protocol, unchanged) whose
# hardware profile renders through components/beacon_engine.h.
substitutions:
  coreview_topic_root: home/signage
  coreview_target_id: replace-me
  coreview_state_topic: ${coreview_topic_root}/matrix/${coreview_target_id}/state
  coreview_status_topic: ${coreview_topic_root}/matrix/${coreview_target_id}/status
  coreview_ack_topic: ${coreview_topic_root}/matrix/${coreview_target_id}/ack
  coreview_control_topic: ${coreview_topic_root}/matrix/${coreview_target_id}/control

esphome:
  includes:
    - components/coreview_audio_reactive.h
    - components/coreview_scoreboard.h
    - components/coreview_scoreboard_font.h
    - components/beacon_fonts.h
    - components/beacon_engine.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(coreview_boot_until) = millis() + 3500U;
          id(coreview_claimed) = false;
          if (id(coreview_claim_code) == "000000") {
            id(coreview_claim_code) = std::to_string(1000000U + (esp_random() % 900000U)).substr(1);
          }

logger:

# Keep the native ESPHome API enabled alongside MQTT. MQTT is CoreView's
# desired-state/control transport; the API restores the familiar ESPHome
# device panel for direct mode/effect/palette and diagnostics controls.
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${coreview_target_id} Fallback

captive_portal:

time:
  - platform: sntp
    id: coreview_time

globals:
  # Not restored: after a reboot the retained state carries the same revision
  # the Beacon last applied, and a restored value made it skip that state.
  - id: coreview_revision
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: coreview_claim_code
    type: std::string
    restore_value: yes
    initial_value: '"000000"'
  - id: coreview_claimed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: coreview_scene
    type: std::string
    restore_value: no
    initial_value: '"clock"'
  # Countdown scene (kitchen timer): running/paused/done, end time (epoch s),
  # seconds left while paused, total length (s) for the progress bar.
  - id: coreview_count_state
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: coreview_count_ends
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: coreview_count_remaining
    type: int
    restore_value: no
    initial_value: '0'
  - id: coreview_count_duration
    type: int
    restore_value: no
    initial_value: '0'
  - id: coreview_title
    type: std::string
    restore_value: no
    initial_value: '"COREVIEW"'
  - id: coreview_detail
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: coreview_ticker
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: coreview_severity
    type: std::string
    restore_value: no
    initial_value: '"info"'
  - id: coreview_icon
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: coreview_flash_border
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: coreview_boot_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: coreview_effect
    type: std::string
    restore_value: no
    initial_value: '"scanner"'
  - id: coreview_palette
    type: std::string
    restore_value: no
    initial_value: '"neon"'
  - id: coreview_effect_speed
    type: int
    restore_value: no
    initial_value: '35'
  - id: coreview_effect_intensity
    type: int
    restore_value: no
    initial_value: '60'
  - id: coreview_music_mode
    type: std::string
    restore_value: no
    initial_value: '"spectrum"'
  - id: coreview_music_bands
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: coreview_music_level
    type: int
    restore_value: no
    initial_value: '0'
  - id: coreview_music_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: coreview_audio_reactive
    # ESPHome emits globals before its copied-header include block. Keep this
    # opaque here, then cast it only in generated lambdas after that include.
    type: void *
    restore_value: no
    initial_value: 'nullptr'
  - id: coreview_matrix_background
    type: std::string
    restore_value: no
    initial_value: '"#000000"'
  - id: coreview_matrix_primary
    type: std::string
    restore_value: no
    initial_value: '"#e6e8ed"'
  - id: coreview_matrix_secondary
    type: std::string
    restore_value: no
    initial_value: '"#0080ff"'
  - id: coreview_matrix_accent
    type: std::string
    restore_value: no
    initial_value: '"#ffb000"'
  - id: coreview_matrix_critical
    type: std::string
    restore_value: no
    initial_value: '"#ff2000"'
  - id: coreview_brightness
    type: int
    restore_value: no
    initial_value: '64'

script:
  - id: coreview_publish_status
    then:
      - mqtt.publish_json:
          topic: ${coreview_status_topic}
          retain: true
          payload: |-
            root["schema"] = "coreview.matrix.status.v1";
            root["online"] = true;
            root["width"] = id(coreview_matrix).get_width();
            root["height"] = id(coreview_matrix).get_height();
            root["colorDepth"] = ${matrix_color_depth};
            root["rotation"] = ${matrix_rotation};
            root["firmwareVersion"] = "beacon-2.1";
            JsonArray features = root["features"].to<JsonArray>();
            features.add("clock"); features.add("status"); features.add("notification"); features.add("scoreboard");
            features.add("ticker"); features.add("icons"); features.add("music"); features.add("localAudio"); features.add("countdown");
            root["claimCode"] = id(coreview_claim_code);
            root["claimed"] = id(coreview_claimed);

interval:
  - interval: 30s
    then:
      - if:
          condition:
            mqtt.connected:
          then:
            - script.execute: coreview_publish_status

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  birth_message:
    topic: ${coreview_status_topic}
    payload: '{"schema":"coreview.matrix.status.v1","online":true}'
    retain: true
  will_message:
    topic: ${coreview_status_topic}
    payload: '{"schema":"coreview.matrix.status.v1","online":false}'
    retain: true
  on_connect:
    - script.execute: coreview_publish_status
  on_json_message:
    topic: ${coreview_state_topic}
    then:
      - lambda: |-
          const char *schema = x["schema"] | "";
          const uint32_t revision = x["revision"] | 0;
          if (std::string(schema) != "coreview.matrix.state.v1") return;
          id(coreview_claimed) = true;
          if (revision <= id(coreview_revision)) return;
          JsonObjectConst scene = x["scene"].as<JsonObjectConst>();
          if (scene.isNull()) return;
          JsonObjectConst theme = x["theme"].as<JsonObjectConst>();
          id(coreview_revision) = revision;
          id(coreview_matrix_background) = theme["background"] | "#000000";
          id(coreview_matrix_primary) = theme["primary"] | "#e6e8ed";
          id(coreview_matrix_secondary) = theme["secondary"] | "#0080ff";
          id(coreview_matrix_accent) = theme["accent"] | "#ffb000";
          id(coreview_matrix_critical) = theme["critical"] | "#ff2000";
          id(coreview_brightness) = std::max(1, std::min(255, theme["brightness"] | 64));
          const std::string next_scene = scene["kind"] | "unsupported";
          if (next_scene == "scoreboard") {
            auto &board = coreview_scoreboard::state();
            const std::string next_ticker = std::string(scene["ticker"] | "").substr(0, 512);
            if (next_ticker != board.ticker || id(coreview_scene) != "scoreboard") board.ticker_epoch = millis();
            board.ticker = next_ticker;
            board.home_label = std::string(scene["homeLabel"] | "HOME").substr(0, 5);
            board.guest_label = std::string(scene["guestLabel"] | "GUEST").substr(0, 5);
            board.home_score = coreview_scoreboard::score(scene["homeScore"] | "--");
            board.guest_score = coreview_scoreboard::score(scene["guestScore"] | "--");
            board.period = std::string(scene["period"] | "").substr(0, 5);
            board.time = std::string(scene["remainingTime"] | "").substr(0, 6);
            board.left_on = scene["leftOn"] | false;
            board.right_on = scene["rightOn"] | false;
            auto read_color = [](const char *value, uint32_t fallback) -> uint32_t {
              unsigned int rgb;
              return strlen(value) == 7 && value[0] == '#' && sscanf(value + 1, "%06x", &rgb) == 1 ? rgb : fallback;
            };
            board.left_color = read_color(scene["leftColor"] | "", 0x63D44D);
            board.right_color = read_color(scene["rightColor"] | "", 0xFFAD21);
            // Team logos: base64 RGB grids (18x18, or 15x15 for three-digit scores); empty = initials.
            board.left_logo = coreview_scoreboard::decode_logo(scene["leftLogo"] | "");
            board.right_logo = coreview_scoreboard::decode_logo(scene["rightLogo"] | "");
            const float requested_speed = scene["tickerSpeed"] | 9.0f;
            board.speed = std::isfinite(requested_speed) ? std::max(0.0f, std::min(40.0f, requested_speed)) : 9.0f;
          }
          if (next_scene == "countdown") {
            id(coreview_count_state) = std::string(scene["state"] | "running").substr(0, 8);
            id(coreview_count_ends) = (int64_t) (scene["endsAt"] | 0.0);
            id(coreview_count_remaining) = std::max(0, scene["remaining"] | 0);
            id(coreview_count_duration) = std::max(0, scene["duration"] | 0);
          }
          id(coreview_scene) = next_scene;
          const char *scene_title = scene["title"] | "CoreView";
          const char *effect_text = scene["text"] | "";
          id(coreview_title) = id(coreview_scene) == "effect" && effect_text[0]
            ? effect_text
            : scene_title;
          id(coreview_detail) = scene["detail"] | "";
          id(coreview_severity) = scene["severity"] | "info";
          id(coreview_icon) = scene["icon"] | "";
          id(coreview_flash_border) = scene["flashBorder"] | false;
          id(coreview_effect) = scene["effect"] | "scanner";
          id(coreview_palette) = scene["palette"] | "neon";
          id(coreview_effect_speed) = scene["speed"] | 35;
          id(coreview_effect_intensity) = scene["intensity"] | 60;
          id(coreview_music_mode) = scene["mode"] | "spectrum";
          JsonObjectConst visualizer = scene["visualizer"].as<JsonObjectConst>();
          id(coreview_music_level) = std::max(0, std::min(255, visualizer["level"] | 0));
          id(coreview_music_active) = visualizer["active"] | false;
          std::string packed_bands;
          JsonArrayConst bands = visualizer["bands"].as<JsonArrayConst>();
          for (JsonVariantConst band : bands) {
            if (!packed_bands.empty()) packed_bands += ',';
            packed_bands += std::to_string(std::max(0, std::min(255, band.as<int>())));
          }
          id(coreview_music_bands) = packed_bands;
          JsonArrayConst fields = scene["fields"].as<JsonArrayConst>();
          if (id(coreview_detail).empty() && !fields.isNull() && fields.size() > 0) {
            JsonObjectConst first = fields[0].as<JsonObjectConst>();
            const char *value = first["value"] | "";
            id(coreview_detail) = value;
          }
          JsonObjectConst ticker = scene["ticker"].as<JsonObjectConst>();
          id(coreview_ticker) = ticker.isNull() ? "" : (ticker["message"] | "");
          JsonObjectConst controls = x["controls"].as<JsonObjectConst>();
          if (!controls.isNull()) {
            const std::string mode = controls["mode"] | "display";
            id(coreview_control_mode).publish_state(mode == "lights" ? "Lights" : (mode == "music" ? "Music" : "Display"));
            const std::string effect = controls["effect"] | "scanner";
            std::string effect_label = "Scanner";
            if (effect == "bouncing_text") effect_label = "Bouncing Text";
            else if (effect == "rainbow_waves") effect_label = "Rainbow Waves";
            else if (effect == "digital_rain") effect_label = "Digital Rain";
            else if (effect == "color_vortex") effect_label = "Color Vortex";
            else if (effect == "fire") effect_label = "Fire";
            else if (effect == "twinkle") effect_label = "Twinkle";
            else if (effect == "aurora") effect_label = "Aurora";
            else if (effect == "confetti") effect_label = "Confetti";
            else if (effect == "starfield") effect_label = "Stars";
            else if (effect == "plasma") effect_label = "Plasma";
            else if (effect == "fireworks") effect_label = "Fireworks";
            else if (effect == "lava") effect_label = "Lava Lamp";
            else if (effect == "life") effect_label = "Life";
            else if (effect == "ripples") effect_label = "Ripples";
            else if (effect == "pong") effect_label = "Pong";
            id(coreview_control_effect).publish_state(effect_label);
            const std::string palette = controls["palette"] | "neon";
            id(coreview_control_palette).publish_state(palette == "ocean" ? "Ocean" : (palette == "sunset" ? "Sunset" : (palette == "forest" ? "Forest" : (palette == "party" ? "Party" : "Neon"))));
            id(coreview_control_brightness).publish_state(std::max(1, std::min(100, controls["brightness"] | 25)));
            id(coreview_control_speed).publish_state(std::max(1, std::min(100, controls["speed"] | 35)));
            id(coreview_control_intensity).publish_state(std::max(1, std::min(100, controls["intensity"] | 60)));
            const std::string audio_mode = controls["audioMode"] | "pulse_rings";
            id(coreview_control_audio_mode).publish_state(audio_mode == "orbit" ? "Orbit" : (audio_mode == "waterfall" ? "Waterfall" : "Pulse Rings"));
            id(coreview_control_scanner_text).publish_state(controls["scannerText"] | "");
            id(coreview_control_bouncing_text).publish_state(controls["bouncingText"] | "");
          }
      - hub75.set_brightness:
          id: coreview_matrix
          brightness: !lambda 'return (uint8_t) id(coreview_brightness);'
      - mqtt.publish_json:
          topic: ${coreview_ack_topic}
          payload: |-
            root["schema"] = "coreview.matrix.ack.v1";
            root["revision"] = id(coreview_revision);
            root["ok"] = true;

select:
  - platform: template
    id: coreview_control_mode
    name: "CoreView Matrix Mode"
    options: ["Display", "Lights", "Music"]
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "mode";
            root["value"] = x;
  - platform: template
    id: coreview_control_effect
    name: "CoreView Matrix Effect"
    options: ["Scanner", "Bouncing Text", "Rainbow Waves", "Aurora", "Digital Rain", "Fire", "Twinkle", "Color Vortex", "Confetti", "Stars", "Plasma",
              "Fireworks", "Lava Lamp", "Life", "Ripples", "Pong"]
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "effect";
            root["value"] = x;
  - platform: template
    id: coreview_control_palette
    name: "CoreView Matrix Palette"
    options: ["Neon", "Ocean", "Sunset", "Forest", "Party"]
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "palette";
            root["value"] = x;
  - platform: template
    id: coreview_control_audio_mode
    name: "CoreView Matrix Audio Mode"
    options: ["Pulse Rings", "Orbit", "Waterfall"]
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "audio_mode";
            root["value"] = x;

number:
  - platform: template
    id: coreview_control_brightness
    name: "CoreView Matrix Brightness"
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "brightness";
            root["value"] = x;
  - platform: template
    id: coreview_control_speed
    name: "CoreView Matrix Effect Speed"
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "speed";
            root["value"] = x;
  - platform: template
    id: coreview_control_intensity
    name: "CoreView Matrix Effect Intensity"
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    optimistic: false
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "intensity";
            root["value"] = x;

text:
  - platform: template
    id: coreview_control_scanner_text
    name: "CoreView Scanner Word"
    mode: text
    optimistic: false
    min_length: 0
    max_length: 16
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "scanner_text";
            root["value"] = x;
  - platform: template
    id: coreview_control_bouncing_text
    name: "CoreView Bouncing Text Word"
    mode: text
    optimistic: false
    min_length: 0
    max_length: 16
    set_action:
      - mqtt.publish_json:
          topic: ${coreview_control_topic}
          payload: |-
            root["schema"] = "coreview.matrix.control.v1";
            root["control"] = "bouncing_text";
            root["value"] = x;

button:
  - platform: restart
    name: "CoreView Beacon Restart"

sensor:
  - platform: wifi_signal
    name: "CoreView Beacon WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "CoreView Beacon Uptime"
    type: seconds
  - platform: template
    name: "CoreView Matrix Scene Revision"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return id(coreview_revision);'

binary_sensor:
  - platform: status
    name: "CoreView Beacon Online"

